<svg xmlns="http://www.w3.org/2000/svg" class="cl-anim" viewBox="17 17 781.23 222" role="img" aria-label="Clineo"><style>
.cl-anim{--jade:#1F9D8B;--pessego:#FFB48A;--ink:#0E2E2B;--d:1}
.cl-anim *{transform-box:view-box}
.cl-anim .cl-base{fill:var(--jade);transform-origin:128px 128px;animation:cl-pop calc(.62s*var(--d)) cubic-bezier(.2,.9,.25,1.25) both}
.cl-anim .cl-full{animation:cl-off 1ms steps(1) calc(.95s*var(--d)) both}
.cl-anim .cl-cut{animation:cl-on 1ms steps(1) calc(.95s*var(--d)) both}
.cl-anim .cl-hole{transform-origin:128px 128px;animation:cl-grow calc(.5s*var(--d)) cubic-bezier(.3,.8,.3,1) calc(.38s*var(--d)) both}
.cl-anim .cl-slot{transform-origin:128px 128px;animation:cl-growx calc(.42s*var(--d)) cubic-bezier(.4,0,.2,1) calc(.62s*var(--d)) both}
.cl-anim .cl-gt{transform-origin:128px 90px;animation:cl-growy calc(.36s*var(--d)) cubic-bezier(.4,0,.2,1) calc(.82s*var(--d)) both}
.cl-anim .cl-gb{transform-origin:128px 166px;animation:cl-growy calc(.36s*var(--d)) cubic-bezier(.4,0,.2,1) calc(.82s*var(--d)) both}
.cl-anim .cl-petal{transform-origin:135px 128px;animation:cl-bloom calc(.7s*var(--d)) cubic-bezier(.3,1.4,.4,1) calc(.95s*var(--d)) both}
.cl-anim.cl-loop .cl-petal{animation:cl-bloom calc(.7s*var(--d)) cubic-bezier(.3,1.4,.4,1) calc(.95s*var(--d)) both,cl-breathe 1.6s ease-in-out calc(2.6s*var(--d)) infinite}
.cl-anim .cl-l{animation:cl-letter calc(.5s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
/* horizontal: símbolo nasce no centro e desliza para a esquerda; o nome sai de trás dele */
.cl-anim .cl-sym-h{animation:cl-slidex calc(.8s*var(--d)) cubic-bezier(.65,0,.25,1) calc(1.5s*var(--d)) both}
.cl-anim .cl-lh{animation:cl-letter-h calc(.6s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
/* vertical B: nome revelado do centro para fora */
.cl-anim .cl-reveal{transform-origin:var(--rx) 0;animation:cl-growx calc(.7s*var(--d)) cubic-bezier(.65,0,.25,1) calc(1.45s*var(--d)) both}
.cl-anim .cl-wgroup-b{animation:cl-rise calc(.7s*var(--d)) cubic-bezier(.2,.8,.2,1) calc(1.45s*var(--d)) both}
/* vertical C: símbolo nasce no centro da tela e sobe; o nome sai de trás dele */
.cl-anim .cl-sym-v{animation:cl-slidey calc(.8s*var(--d)) cubic-bezier(.65,0,.25,1) calc(1.5s*var(--d)) both}
.cl-anim .cl-lv{animation:cl-letter-v calc(.6s*var(--d)) cubic-bezier(.2,.8,.2,1) both}
/* vertical D: letras saltam do centro para fora */
.cl-anim .cl-lp{transform-box:fill-box;transform-origin:50% 100%;animation:cl-pulo calc(.55s*var(--d)) cubic-bezier(.3,1.6,.5,1) both}
@keyframes cl-pop{0%{opacity:0;transform:scale(.35) rotate(-12deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes cl-off{from{opacity:1}to{opacity:0}}
@keyframes cl-on{from{opacity:0}to{opacity:1}}
@keyframes cl-grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes cl-growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cl-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cl-bloom{0%{fill:var(--jade);transform:scale(1)}35%{fill:var(--pessego);transform:scale(1.14)}100%{fill:var(--pessego);transform:scale(1)}}
@keyframes cl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes cl-letter{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes cl-letter-h{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
@keyframes cl-letter-v{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:translateY(0)}}
@keyframes cl-slidex{from{transform:translateX(var(--dx))}to{transform:translateX(0)}}
@keyframes cl-slidey{from{transform:translateY(var(--dy))}to{transform:translateY(0)}}
@keyframes cl-rise{from{transform:translateY(16px)}to{transform:translateY(0)}}
@keyframes cl-pulo{0%{opacity:0;transform:scale(0)}40%{opacity:1}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cl-anim *{animation:none!important}.cl-anim .cl-petal{fill:var(--pessego)}.cl-anim .cl-full{opacity:0}}
</style><clipPath id="clch"><rect class="cl-sym-h" style="--dx:279.6px" x="255.3" y="-200" width="2000" height="700"/></clipPath><g class="cl-sym-h" style="--dx:279.6px"><mask id="clmh" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1100" height="1100"><rect x="-400" y="-400" width="1100" height="1100" fill="#fff"/><circle class="cl-hole" cx="128" cy="128" r="46" fill="#000"/><rect class="cl-slot" x="128" y="106" width="130" height="44" fill="#000"/><rect class="cl-gt" x="121" y="0" width="14" height="90" fill="#000"/><rect class="cl-gb" x="121" y="166" width="14" height="90" fill="#000"/></mask><g mask="url(#clmh)"><g class="cl-base"><path class="cl-full" d="M125,21 H209 A26,26 0 0 1 235,47 V131 A104,104 0 0 1 131,235 H47 A26,26 0 0 1 21,209 V125 A104,104 0 0 1 125,21 Z"/><path class="cl-cut" fill-rule="evenodd" d="M125,21 H209 A26,26 0 0 1 235,47 V131 A104,104 0 0 1 131,235 H47 A26,26 0 0 1 21,209 V125 A104,104 0 0 1 125,21 Z M135,21 H209 A26,26 0 0 1 235,47 V128 H135 Z"/><path class="cl-petal" d="M135,21 H209 A26,26 0 0 1 235,47 V128 H135 Z"/></g></g></g><g clip-path="url(#clch)"><g transform="translate(293,174) scale(1) translate(-6.18,0)"><path class="cl-lh" style="animation-delay:calc(1.75s*var(--d))" d="M51.25952813067151 -93.50272232304901Q67.95644283121598 -93.50272232304901 78.89292196007261 -85.5716878402904Q89.82940108892923 -77.64065335753176 93.66969147005446 -62.94736842105264H73.13248638838476Q70.62794918330309 -69.79310344827587 65.11796733212341 -73.63339382940109Q59.60798548094374 -77.47368421052632 51.25952813067151 -77.47368421052632Q39.57168784029038 -77.47368421052632 32.64246823956443 -69.2087114337568Q25.713248638838476 -60.9437386569873 25.713248638838476 -46.08348457350272Q25.713248638838476 -31.22323049001815 32.64246823956443 -22.87477313974592Q39.57168784029038 -14.526315789473685 51.25952813067151 -14.526315789473685Q67.78947368421053 -14.526315789473685 73.13248638838476 -29.05263157894737H93.66969147005446Q89.66243194192378 -15.